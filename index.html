<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>入团积极分子考试练习</title>
<style>
:root{
  --red:#d8232a; --red-dark:#b01c22; --gold:#f5c518; --gold-soft:#fdf3d3;
  --ink:#2b2b2b; --muted:#8a8a8a; --line:#ececec; --bg:#f6f6f8;
  --ok:#1e9e5a; --ok-bg:#e7f6ee; --bad:#d8232a; --bad-bg:#fdeaea;
  --card:#ffffff; --radius:14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  background:var(--bg); color:var(--ink); font-size:16px; line-height:1.6;
  padding-bottom:70px;
}
.hidden{display:none !important;}
/* Header */
header{
  background:linear-gradient(135deg,var(--red) 0%,var(--red-dark) 100%);
  color:#fff; padding:18px 16px 16px; position:sticky; top:0; z-index:20;
  box-shadow:0 2px 10px rgba(216,35,42,.25);
}
header .t{font-size:20px; font-weight:700; letter-spacing:1px;}
header .s{font-size:12px; opacity:.85; margin-top:2px;}
/* Tabs */
nav.tabs{
  position:fixed; bottom:0; left:0; right:0; background:var(--card);
  display:flex; border-top:1px solid var(--line); z-index:30;
  box-shadow:0 -2px 10px rgba(0,0,0,.05);
}
nav.tabs button{
  flex:1; border:0; background:none; padding:9px 2px 8px; font-size:11px;
  color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer;
}
nav.tabs button .ic{font-size:20px; line-height:1;}
nav.tabs button.on{color:var(--red); font-weight:600;}
/* Layout */
main{max-width:720px; margin:0 auto; padding:16px;}
section.view{padding-bottom:12px;}
/* Cards & buttons */
.card{background:var(--card); border-radius:var(--radius); padding:16px; margin-bottom:14px; box-shadow:0 1px 4px rgba(0,0,0,.04);}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  background:var(--red); color:#fff; border:0; border-radius:10px;
  padding:12px 20px; font-size:16px; font-weight:600; cursor:pointer; transition:.15s;
}
.btn:active{transform:scale(.98);}
.btn.ghost{background:#fff; color:var(--red); border:1px solid var(--red);}
.btn.gold{background:var(--gold); color:#5a4300;}
.btn.block{width:100%;}
.btn:disabled{opacity:.45; cursor:not-allowed;}
/* Home */
.hero{background:linear-gradient(135deg,var(--red),var(--red-dark)); color:#fff; border-radius:var(--radius); padding:22px 18px; margin-bottom:14px;}
.hero .big{font-size:26px; font-weight:800; letter-spacing:1px;}
.hero .sub{font-size:13px; opacity:.9; margin-top:4px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.menu-item{background:var(--card); border-radius:var(--radius); padding:16px; text-align:center; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.04);}
.menu-item .ic{font-size:30px;}
.menu-item .nm{font-weight:700; margin-top:6px; font-size:15px;}
.menu-item .ds{font-size:11px; color:var(--muted); margin-top:2px;}
.stat-row{display:flex; gap:12px; margin-bottom:14px;}
.stat{flex:1; background:var(--card); border-radius:var(--radius); padding:12px; text-align:center;}
.stat .n{font-size:24px; font-weight:800; color:var(--red);}
.stat .l{font-size:11px; color:var(--muted);}
/* Question */
.qhead{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
.tag{font-size:11px; padding:2px 8px; border-radius:6px; background:var(--red); color:#fff;}
.tag.blue{background:#2f6fd8;}
.tag.green{background:var(--ok);}
.qtext{font-size:16px; font-weight:600; margin-bottom:14px;}
.opt{
  display:block; width:100%; text-align:left; background:#fff; border:1.5px solid var(--line);
  border-radius:10px; padding:12px 14px; margin-bottom:10px; font-size:15px; cursor:pointer; transition:.12s;
}
.opt .letter{display:inline-block; min-width:22px; height:22px; line-height:22px; text-align:center; border-radius:50%; background:#f0f0f0; color:var(--ink); font-weight:700; margin-right:8px; font-size:13px;}
.opt.sel{border-color:var(--red); background:#fff7f7;}
.opt.sel .letter{background:var(--red); color:#fff;}
.opt.ok{border-color:var(--ok); background:var(--ok-bg);}
.opt.ok .letter{background:var(--ok); color:#fff;}
.opt.bad{border-color:var(--bad); background:var(--bad-bg);}
.opt.bad .letter{background:var(--bad); color:#fff;}
.opt:disabled{cursor:default;}
.feedback{border-radius:10px; padding:12px 14px; margin-top:4px; font-size:14px;}
.feedback.ok{background:var(--ok-bg); color:var(--ok);}
.feedback.bad{background:var(--bad-bg); color:var(--bad);}
.explain{background:#fff8e6; border:1px solid #f2e0ac; color:#7a5a00; border-radius:10px; padding:12px 14px; margin-top:10px; font-size:14px;}
/* progress */
.pbar{height:8px; background:#eee; border-radius:6px; overflow:hidden; margin:10px 0;}
.pbar>i{display:block; height:100%; background:var(--red); transition:width .2s;}
.toolbar{display:flex; gap:10px; margin-top:14px;}
.toolbar .btn{flex:1;}
/* config */
.cfg-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
.cfg-row label{font-size:15px;}
.cfg-row input{width:64px; text-align:center; font-size:16px; padding:8px; border:1.5px solid var(--line); border-radius:8px;}
/* result */
.score-circle{width:120px; height:120px; border-radius:50%; background:linear-gradient(135deg,var(--red),var(--red-dark)); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; margin:0 auto 14px;}
.score-circle .n{font-size:34px; font-weight:800;}
.score-circle .l{font-size:12px; opacity:.9;}
.result-bar{display:flex; justify-content:space-around; text-align:center; margin:14px 0;}
.result-bar .c .n{font-size:22px; font-weight:800;}
.result-bar .c .l{font-size:11px; color:var(--muted);}
/* timeline */
.tl{position:relative; padding-left:26px;}
.tl::before{content:""; position:absolute; left:9px; top:6px; bottom:6px; width:2px; background:linear-gradient(var(--red),var(--gold)); border-radius:2px;}
.tl-item{position:relative; padding-bottom:20px;}
.tl-item::before{content:""; position:absolute; left:-26px; top:6px; width:20px; height:20px; background:#fff; border:4px solid var(--red); border-radius:50%; box-sizing:border-box;}
.tl-item .yr{font-weight:800; font-size:17px; color:var(--red);}
.tl-item .dt{font-size:13px; color:var(--muted); margin-left:6px;}
.tl-item .ev{font-size:14px; margin-top:3px;}
.tl-item .rf{font-size:11px; color:#b0b0b0; margin-top:2px;}
/* wrongbook list */
.wb-item{background:var(--card); border-radius:var(--radius); padding:14px; margin-bottom:10px; border-left:3px solid var(--red);}
.wb-item .wt{font-size:12px; color:var(--muted); margin-bottom:4px;}
.wb-item .wq{font-size:14px; font-weight:600; margin-bottom:6px;}
.wb-item .wa{font-size:13px;}
.wb-item .wa b.ok{color:var(--ok);} .wb-item .wa b.bad{color:var(--bad);}
/* segmented */
.seg{display:flex; background:#eee; border-radius:10px; padding:4px; margin-bottom:14px;}
.seg button{flex:1; border:0; background:none; padding:9px 0; font-size:14px; border-radius:8px; cursor:pointer; color:var(--muted);}
.seg button.on{background:#fff; color:var(--red); font-weight:700; box-shadow:0 1px 3px rgba(0,0,0,.1);}
.center{text-align:center;}
.muted{color:var(--muted);}
.mt{margin-top:12px;}
@media(min-width:640px){
  nav.tabs{top:0; bottom:auto; left:auto; right:auto; width:100%; justify-content:center; border-top:0; border-bottom:1px solid var(--line); box-shadow:none; background:var(--card);}
  nav.tabs button{flex:0 0 120px; flex-direction:row; gap:6px; font-size:14px;}
  body{padding-top:56px; padding-bottom:24px;}
  header{position:static;}
}
</style>
</head>
<body>
<header>
  <div class="t">入团积极分子考试练习</div>
  <div class="s">题库共 <span id="totalCount"></span> 题 · 单选/多选/判断 · 含团史时间线</div>
</header>

<main>
  <!-- 首页 -->
  <section class="view" id="view-home">
    <div class="hero">
      <div class="big">共青团知识 学习自测</div>
      <div class="sub">练习 · 模拟考试 · 错题本 · 团史时间线，本地运行，无需联网</div>
    </div>
    <div class="stat-row">
      <div class="stat"><div class="n" id="st-practiced">0</div><div class="l">已练习</div></div>
      <div class="stat"><div class="n" id="st-correct">0</div><div class="l">正确率</div></div>
      <div class="stat"><div class="n" id="st-wrong">0</div><div class="l">错题数</div></div>
    </div>
    <div class="grid2">
      <div class="menu-item" data-go="practice"><div class="ic">📝</div><div class="nm">练习模式</div><div class="ds">逐题作答，即时判分</div></div>
      <div class="menu-item" data-go="exam"><div class="ic">🏆</div><div class="nm">模拟考试</div><div class="ds">随机组卷，计时计分</div></div>
      <div class="menu-item" data-go="wrong"><div class="ic">📕</div><div class="nm">错题本</div><div class="ds">错题重练，查漏补缺</div></div>
      <div class="menu-item" data-go="timeline"><div class="ic">🕰️</div><div class="nm">团史时间线</div><div class="ds">题库中的团史大事</div></div>
    </div>
  </section>

  <!-- 练习 -->
  <section class="view hidden" id="view-practice">
    <div class="seg" id="practice-seg">
      <button data-m="single" class="on">单选</button>
      <button data-m="multiple">多选</button>
      <button data-m="judge">判断</button>
      <button data-m="all">全部</button>
    </div>
    <div class="card hidden" id="practice-setup">
      <div class="center muted" style="padding:20px 0;">选择练习题型后开始</div>
    </div>
    <div class="card" id="practice-card">
      <div class="pbar"><i id="practice-pbar"></i></div>
      <div id="practice-q"></div>
      <div class="toolbar">
        <button class="btn ghost" id="practice-prev" style="flex:0 0 auto;">上一题</button>
        <button class="btn" id="practice-next">下一题</button>
      </div>
    </div>
  </section>

  <!-- 考试 -->
  <section class="view hidden" id="view-exam">
    <div class="card" id="exam-config">
      <h3 style="margin-top:0;">模拟考试设置</h3>
      <div class="cfg-row"><label>单选题数</label><input type="number" id="cfg-single" value="20" min="0" max="115"></div>
      <div class="cfg-row"><label>多选题数</label><input type="number" id="cfg-multiple" value="10" min="0" max="70"></div>
      <div class="cfg-row"><label>判断题数</label><input type="number" id="cfg-judge" value="10" min="0" max="40"></div>
      <div class="cfg-row"><label>考试时长（分钟）</label><input type="number" id="cfg-time" value="60" min="1"></div>
      <div class="cfg-row"><label>随机抽题</label><span>✔ 是</span></div>
      <button class="btn block" id="exam-start">开始考试</button>
      <p class="muted" style="font-size:12px;margin-bottom:0;">提示：多选题需全部选对才得分；判断题错误选项会给出解析。</p>
    </div>
    <div class="card hidden" id="exam-card">
      <div class="toolbar" style="margin:0 0 10px;">
        <div class="muted" style="font-size:13px;" id="exam-info"></div>
        <div style="margin-left:auto;font-weight:700;color:var(--red);" id="exam-clock"></div>
      </div>
      <div class="pbar"><i id="exam-pbar"></i></div>
      <div id="exam-q"></div>
      <div class="toolbar">
        <button class="btn ghost" id="exam-prev" style="flex:0 0 auto;">上一题</button>
        <button class="btn" id="exam-next">下一题</button>
        <button class="btn gold" id="exam-submit" style="flex:0 0 auto;">交卷</button>
      </div>
    </div>
    <div class="card hidden" id="exam-result"></div>
  </section>

  <!-- 错题本 -->
  <section class="view hidden" id="view-wrong">
    <div class="toolbar" style="margin:0 0 12px;">
      <button class="btn" id="wb-retry">重练错题</button>
      <button class="btn ghost" id="wb-clear">清空</button>
    </div>
    <div id="wb-list"></div>
  </section>

  <!-- 时间线 -->
  <section class="view hidden" id="view-timeline">
    <div class="card">
      <h3 style="margin-top:0;">中国共产主义青年团团史时间线</h3>
      <p class="muted" style="font-size:13px;">仅收录本题库中出现的历史事件，按时间排序。</p>
    </div>
    <div class="card"><div class="tl" id="tl-list"></div></div>
    <div class="card">
      <h4 style="margin-top:0;">题库提及、但未给出具体时间的事件</h4>
      <ul id="tl-nodate" style="padding-left:20px;font-size:14px;color:var(--muted);"></ul>
    </div>
  </section>
</main>

<nav class="tabs">
  <button data-tab="home" class="on"><span class="ic">🏠</span><span>首页</span></button>
  <button data-tab="practice"><span class="ic">📝</span><span>练习</span></button>
  <button data-tab="exam"><span class="ic">🏆</span><span>考试</span></button>
  <button data-tab="wrong"><span class="ic">📕</span><span>错题</span></button>
  <button data-tab="timeline"><span class="ic">🕰️</span><span>时间线</span></button>
</nav>

<script>
(function(){
"use strict";
const BANK = window.BANK, TIMELINE = window.TIMELINE;
const LETTERS = ['A','B','C','D','E'];
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- 工具 ---------- */
function shuffle(arr){ const a = arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function fmtBlank(t){ return t.replace(/_{4,}/g,'____').replace(/（）/g,'（ ）'); }

/* ---------- 数据 ---------- */
function allQuestions(){
  const out = [];
  BANK.single.forEach(q=>out.push({type:'single', kind:'单选题', q:q.q, options:q.options, answer:q.answer}));
  BANK.multiple.forEach(q=>out.push({type:'multiple', kind:'多选题', q:q.q, options:q.options, answer:q.answer}));
  BANK.judge.forEach(q=>out.push({type:'judge', kind:'判断题', q:q.q, answer:q.answer, explain:q.explain}));
  return out;
}

/* ---------- 导航 ---------- */
function switchTab(tab){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab));
  ['home','practice','exam','wrong','timeline'].forEach(v=>$('#view-'+v).classList.toggle('hidden', v!==tab));
  if(tab==='home') refreshHome();
  if(tab==='wrong') renderWrongBook();
  if(tab==='timeline') renderTimeline();
}
document.querySelectorAll('nav.tabs button').forEach(b=>b.addEventListener('click', ()=>switchTab(b.dataset.tab)));
document.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click', ()=>switchTab(el.dataset.go)));

/* ---------- 首页统计 ---------- */
function refreshHome(){
  const his = store.get('stats', {practiced:0, correct:0});
  const wb = store.get('wrongbook', []);
  $('#totalCount').textContent = BANK.single.length + BANK.multiple.length + BANK.judge.length;
  $('#st-practiced').textContent = his.practiced||0;
  $('#st-correct').textContent = his.practiced ? Math.round(100*his.correct/his.practiced)+'%' : '—';
  $('#st-wrong').textContent = wb.length;
}

/* ---------- 渲染题目（通用） ---------- */
function renderQuestion(el, q, opts){
  // opts: {mode:'practice'|'exam', selected:[...], locked:bool, userAns:[...]}
  const multi = q.type==='multiple';
  const tagCls = q.type==='single' ? '' : (q.type==='multiple' ? 'blue' : 'green');
  let html = '<div class="qhead"><span class="tag '+tagCls+'">'+q.kind+'</span></div>';
  html += '<div class="qtext">'+fmtBlank(q.q)+'</div>';
  if(q.type==='judge'){
    const ans = q.answer ? '对' : '错';
    ['对','错'].forEach((opt,i)=>{
      const sel = (opts.userAns||[]).includes(opt);
      const ok = opts.locked && (q.answer === (opt==='对'));
      const bad = opts.locked && sel && !ok;
      let cls = 'opt'; if(sel) cls+=' sel'; if(ok) cls+=' ok'; if(bad) cls+=' bad';
      html += '<button class="'+cls+'" data-opt="'+opt+'" '+(opts.locked?'disabled':'')+'><span class="letter">'+(opt==='对'?'✓':'✗')+'</span>'+opt+'</button>';
    });
  } else {
    q.options.forEach((o,i)=>{
      const letter = LETTERS[i];
      const sel = (opts.userAns||[]).includes(letter);
      const ok = opts.locked && (q.answer||'').includes(letter);
      const bad = opts.locked && sel && !ok;
      let cls = 'opt'; if(sel) cls+=' sel'; if(ok) cls+=' ok'; if(bad) cls+=' bad';
      html += '<button class="'+cls+'" data-opt="'+letter+'" '+(opts.locked?'disabled':'')+'><span class="letter">'+letter+'</span>'+fmtBlank(o)+'</button>';
    });
  }
  if(multi && !opts.locked && opts.showConfirm){
    html += '<button class="btn block mt" id="multi-confirm">确认选择</button>';
  }
  if(opts.locked){
    const right = q.type==='judge' ? (q.answer?'对':'错') : (q.answer||'').split('').map(l=>l+'. '+q.options[LETTERS.indexOf(l)]).join('、');
    const isRight = opts.isRight;
    html += '<div class="feedback '+(isRight?'ok':'bad')+'">'+(isRight?'✅ 回答正确':'❌ 回答错误')+'，正确答案：'+right+'</div>';
    if(q.explain) html += '<div class="explain">💡 '+(q.explain||'')+'</div>';
  }
  el.innerHTML = html;
}

/* ---------- 练习模式 ---------- */
let prac = {mode:'single', list:[], idx:0, answered:new Set(), correct:0, selected:[]};
function pracSetup(){
  const seg = $('#practice-seg');
  seg.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>{
    seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b));
    prac.mode = b.dataset.m;
    pracStart();
  }));
}
function pracStart(){
  let src;
  if(prac.mode==='all') src = allQuestions();
  else src = allQuestions().filter(q=>q.type===prac.mode);
  prac.list = shuffle(src);
  prac.idx = 0; prac.answered = new Set(); prac.correct = 0; prac.selected = [];
  $('#practice-setup').classList.add('hidden');
  pracRender();
}
function pracRender(){
  if(prac.idx >= prac.list.length){ pracFinish(); return; }
  const q = prac.list[prac.idx];
  const locked = prac.answered.has(prac.idx);
  $('#practice-pbar').style.width = (100*prac.idx/prac.list.length)+'%';
  $('#practice-prev').disabled = prac.idx===0;
  $('#practice-next').textContent = prac.idx===prac.list.length-1 ? '完成' : '下一题';
  const saved = store.get('pracSelected:'+prac.mode, {});
  const sel = saved[prac.idx] || [];
  renderQuestion($('#practice-q'), q, {locked, userAns:sel, isRight: locked ? isCorrect(q, sel) : undefined, showConfirm:true});
  if(locked) $('#practice-q').querySelectorAll('.opt').forEach(b=>b.disabled=true);
  else bindPracticeOpts(q);
}
function isCorrect(q, sel){
  if(q.type==='judge'){ const v = sel[0]==='对'; return q.answer===v; }
  const a = (q.answer||'').split('').sort().join('');
  const s = (sel||[]).slice().sort().join('');
  return a===s;
}
function bindPracticeOpts(q){
  const el = $('#practice-q');
  const multi = q.type==='multiple';
  const saved = store.get('pracSelected:'+prac.mode, {});
  let sel = saved[prac.idx]||[];
  function mark(){
    el.querySelectorAll('.opt').forEach(b=>{
      const v = b.dataset.opt;
      b.classList.toggle('sel', sel.includes(v));
    });
  }
  el.querySelectorAll('.opt').forEach(b=>{
    b.addEventListener('click', ()=>{
      const v = b.dataset.opt;
      if(multi){
        sel = sel.includes(v) ? sel.filter(x=>x!==v) : sel.concat(v);
        mark();
      } else {
        sel = [v];
        pracAnswer(q, sel);
      }
    });
  });
  const c = el.querySelector('#multi-confirm');
  if(c) c.addEventListener('click', ()=>pracAnswer(q, sel));
}
function pracAnswer(q, sel){
  if(prac.answered.has(prac.idx)) return;
  prac.answered.add(prac.idx);
  const ok = isCorrect(q, sel);
  if(ok) prac.correct++;
  const saved = store.get('pracSelected:'+prac.mode, {});
  saved[prac.idx] = sel; store.set('pracSelected:'+prac.mode, saved);
  // 统计
  const his = store.get('stats', {practiced:0, correct:0});
  his.practiced++; if(ok) his.correct++; store.set('stats', his);
  // 错题本
  if(!ok) addWrong(q, sel);
  renderQuestion($('#practice-q'), q, {locked:true, userAns:sel, isRight:ok});
}
function addWrong(q, sel){
  const wb = store.get('wrongbook', []);
  wb.push({type:q.type, kind:q.kind, q:q.q, options:q.options||null, answer:q.answer, explain:q.explain||'', user:sel, ts:Date.now()});
  store.set('wrongbook', wb);
}
function pracFinish(){
  const total = prac.list.length;
  $('#practice-q').innerHTML = '<div class="center" style="padding:20px 0;">'
    +'<div style="font-size:40px;">🎉</div>'
    +'<div style="font-size:18px;font-weight:700;margin:8px 0;">本组练习完成</div>'
    +'<div class="muted">共 '+total+' 题，答对 '+prac.correct+' 题，正确率 '+(total?Math.round(100*prac.correct/total):0)+'%</div>'
    +'<button class="btn mt" id="prac-again">再练一组</button></div>';
  $('#prac-again').addEventListener('click', pracStart);
}
$('#practice-prev').addEventListener('click', ()=>{ if(prac.idx>0){prac.idx--; pracRender();} });
$('#practice-next').addEventListener('click', ()=>{
  if(prac.idx < prac.list.length-1){ prac.idx++; pracRender(); }
  else if(prac.idx===prac.list.length-1){ prac.idx++; pracRender(); }
});

/* ---------- 模拟考试 ---------- */
let exam = {list:[], idx:0, answers:{}, started:false, deadline:0, timer:null};
function examBuild(){
  const ns = Math.min(parseInt($('#cfg-single').value||0), BANK.single.length);
  const nm = Math.min(parseInt($('#cfg-multiple').value||0), BANK.multiple.length);
  const nj = Math.min(parseInt($('#cfg-judge').value||0), BANK.judge.length);
  if(ns+nm+nj===0){ alert('请至少选择 1 道题'); return; }
  const qs = [];
  shuffle(BANK.single).slice(0,ns).forEach(q=>qs.push({type:'single',kind:'单选题',q:q.q,options:q.options,answer:q.answer}));
  shuffle(BANK.multiple).slice(0,nm).forEach(q=>qs.push({type:'multiple',kind:'多选题',q:q.q,options:q.options,answer:q.answer}));
  shuffle(BANK.judge).slice(0,nj).forEach(q=>qs.push({type:'judge',kind:'判断题',q:q.q,answer:q.answer,explain:q.explain}));
  exam.list = shuffle(qs);
  exam.idx = 0; exam.answers = {}; exam.started = true;
  const mins = Math.max(1, parseInt($('#cfg-time').value||60));
  exam.deadline = Date.now() + mins*60000;
  $('#exam-config').classList.add('hidden');
  $('#exam-card').classList.remove('hidden');
  $('#exam-result').classList.add('hidden');
  exam.timer = setInterval(examTick, 1000);
  examTick();
  examRender();
}
function examTick(){
  const left = exam.deadline - Date.now();
  if(left <= 0){ examSubmit(true); return; }
  const m = Math.floor(left/60000), s = Math.floor(left%60000/1000);
  $('#exam-clock').textContent = '⏱ '+m+':'+String(s).padStart(2,'0');
  if(left < 60000) $('#exam-clock').style.color = '#f5a623';
}
function examRender(){
  const q = exam.list[exam.idx];
  $('#exam-info').textContent = '第 '+(exam.idx+1)+' / '+exam.list.length+' 题';
  $('#exam-pbar').style.width = (100*exam.idx/exam.list.length)+'%';
  $('#exam-prev').disabled = exam.idx===0;
  $('#exam-next').disabled = exam.idx===exam.list.length-1;
  const sel = exam.answers[exam.idx]||[];
  renderQuestion($('#exam-q'), q, {locked:false, userAns:sel});
  const multi = q.type==='multiple';
  const el = $('#exam-q');
  el.querySelectorAll('.opt').forEach(b=>{
    b.addEventListener('click', ()=>{
      const v = b.dataset.opt;
      let sel = exam.answers[exam.idx]||[];
      if(multi){
        sel = sel.includes(v) ? sel.filter(x=>x!==v) : sel.concat(v);
      } else {
        sel = [v];
      }
      exam.answers[exam.idx] = sel;
      examRender();
    });
  });
}
$('#exam-start').addEventListener('click', examBuild);
$('#exam-prev').addEventListener('click', ()=>{ if(exam.idx>0){exam.idx--; examRender();} });
$('#exam-next').addEventListener('click', ()=>{ if(exam.idx<exam.list.length-1){exam.idx++; examRender();} });
$('#exam-submit').addEventListener('click', ()=>examSubmit(false));
function examSubmit(auto){
  if(exam.timer) clearInterval(exam.timer);
  const total = exam.list.length;
  let correct = 0;
  const detail = exam.list.map((q,i)=>{
    const sel = exam.answers[i]||[];
    const ok = isCorrect(q, sel);
    if(ok) correct++;
    return {q, sel, ok};
  });
  const his = store.get('stats', {practiced:0, correct:0});
  his.practiced += total; his.correct += correct; store.set('stats', his);
  detail.forEach(d=>{ if(!d.ok) addWrong(d.q, d.sel); });
  const pct = total?Math.round(100*correct/total):0;
  let html = '<h3 style="margin-top:0;text-align:center;">'+(auto?'时间到，自动交卷':'考试结束')+'</h3>';
  html += '<div class="score-circle"><div class="n">'+pct+'</div><div class="l">得分率</div></div>';
  html += '<div class="result-bar"><div class="c"><div class="n">'+total+'</div><div class="l">总题数</div></div><div class="c"><div class="n" style="color:var(--ok)">'+correct+'</div><div class="l">答对</div></div><div class="c"><div class="n" style="color:var(--bad)">'+(total-correct)+'</div><div class="l">答错</div></div></div>';
  html += '<div class="seg"><button class="on" data-r="all">全部('+total+')</button><button data-r="wrong">错题('+(total-correct)+')</button></div>';
  html += '<div id="exam-review"></div>';
  html += '<button class="btn block mt" id="exam-again">再来一场</button>';
  $('#exam-result').innerHTML = html;
  $('#exam-result').classList.remove('hidden');
  $('#exam-card').classList.add('hidden');
  const rv = $('#exam-review');
  function showReview(filter){
    rv.innerHTML = '';
    detail.forEach((d,i)=>{
      if(filter==='wrong' && d.ok) return;
      const div = document.createElement('div');
      div.className = 'card';
      div.style.marginBottom = '10px';
      renderQuestion(div, d.q, {locked:true, userAns:d.sel, isRight:d.ok});
      rv.appendChild(div);
    });
  }
  showReview('all');
  $('#exam-result').querySelectorAll('.seg button').forEach(b=>b.addEventListener('click', ()=>{
    $('#exam-result').querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on', x===b));
    showReview(b.dataset.r);
  }));
  $('#exam-again').addEventListener('click', ()=>{
    $('#exam-result').classList.add('hidden');
    $('#exam-config').classList.remove('hidden');
  });
}

/* ---------- 错题本 ---------- */
function renderWrongBook(){
  const wb = store.get('wrongbook', []);
  const el = $('#wb-list');
  if(wb.length===0){ el.innerHTML = '<div class="card center muted">暂无错题，先去练习或考试吧～</div>'; return; }
  el.innerHTML = '';
  [...wb].reverse().slice(0, 100).forEach((w,i)=>{
    const right = w.type==='judge' ? (w.answer?'对':'错') : (w.answer||'').split('').map(l=>l+'. '+(w.options?w.options[LETTERS.indexOf(l)]:'')).join('、');
    const your = w.type==='judge' ? (w.user||[]).join('') : (w.user||[]).join('、');
    const div = document.createElement('div');
    div.className = 'wb-item';
    div.innerHTML = '<div class="wt">'+w.kind+'</div>'
      +'<div class="wq">'+fmtBlank(w.q)+'</div>'
      +'<div class="wa">你的答案：<b class="bad">'+your+'</b></div>'
      +'<div class="wa">正确答案：<b class="ok">'+right+'</b></div>'
      +(w.explain?'<div class="wa muted">💡 '+w.explain+'</div>':'');
    el.appendChild(div);
  });
}
$('#wb-clear').addEventListener('click', ()=>{ if(confirm('确定清空错题本？')){ store.set('wrongbook', []); renderWrongBook(); refreshHome(); } });
$('#wb-retry').addEventListener('click', ()=>{
  const wb = store.get('wrongbook', []);
  if(wb.length===0){ alert('暂无错题'); return; }
  prac.list = shuffle(wb.map(w=>({type:w.type,kind:w.kind,q:w.q,options:w.options||[],answer:w.answer,explain:w.explain})));
  prac.mode = 'retry'; prac.idx=0; prac.answered=new Set(); prac.correct=0; prac.selected=[];
  switchTab('practice');
  $('#practice-seg button').forEach(b=>b.classList.toggle('on', b.dataset.m==='all'));
  pracRender();
});

/* ---------- 时间线 ---------- */
function renderTimeline(){
  const el = $('#tl-list');
  el.innerHTML = '';
  TIMELINE.filter(ev=>ev.year).forEach(ev=>{
    const div = document.createElement('div');
    div.className = 'tl-item';
    div.innerHTML = '<div><span class="yr">'+ev.year+'</span><span class="dt">'+(ev.date||'')+'</span></div>'
      +'<div class="ev">'+ev.event+'</div>'
      +(ev.ref?'<div class="rf">'+ev.ref+'</div>':'');
    el.appendChild(div);
  });
  const nodate = TIMELINE.filter(e=>!e.year);
  $('#tl-nodate').innerHTML = nodate.map(e=>'<li>'+e.event+'</li>').join('');
}

/* ---------- 初始化 ---------- */
function init(){
  $('#totalCount').textContent = BANK.single.length + BANK.multiple.length + BANK.judge.length;
  pracSetup();
  refreshHome();
}
init();
})();
</script>
